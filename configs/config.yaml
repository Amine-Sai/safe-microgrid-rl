data_preparation:
  seed: 42
  price_source: proxy_DE
  microgrid_peak_kw: 500.0
  cap_quantile: 0.90
  local_timezone: Europe/Paris
  date_range:
    start: "2017-01-01"
    end: "2019-12-31"
  de_lu_price_splice_utc: "2018-09-30 22:00:00"
  max_interpolation_gap_hours: 6
  pvgis_subhourly_row_factor: 1.1
  events:
    events_per_week: 2
    start_hour_min: 17
    start_hour_max_exclusive: 21
    duration_hours_min: 2
    duration_hours_max_exclusive: 4
    warmup_hours: 1
  zones:
    residential:
      share: 0.35
      weekend_multiplier: 1.0
      profile_type: bimodal_peaks
      baseload_factor: 0.50
      morning_peak_hour: 8.5
      morning_amplitude: 0.65
      morning_width_hours: 2.0
      evening_peak_hour: 19.5
      evening_amplitude: 0.90
      evening_width_hours: 2.5
    commercial:
      share: 0.25
      weekend_multiplier: 0.40
      profile_type: business_window
      baseload_factor: 0.30
      active_amplitude: 1.20
      open_hour: 8.0
      close_hour: 18.0
      ramp_width_hours: 1.25
    stadium:
      share: 0.10
      weekend_multiplier: 1.0
      profile_type: event_driven
      baseload_factor: 0.15
      daytime_maintenance_factor: 0.30
      daytime_start_hour: 9.0
      daytime_end_hour: 17.0
      warmup_multiplier: 1.50
      active_event_multiplier: 3.50
    street:
      share: 0.05
      weekend_multiplier: 1.0
      profile_type: irradiance_driven
      night_irradiance_threshold_wm2: 10.0
      day_irradiance_threshold_wm2: 200.0
      night_multiplier: 1.50
      twilight_multiplier: 0.80
      day_multiplier: 0.10
    industrial:
      share: 0.25
      weekend_multiplier: 0.50
      profile_type: business_window
      baseload_factor: 0.40
      active_amplitude: 0.90
      open_hour: 6.5
      close_hour: 17.5
      ramp_width_hours: 1.50
  splits:
    train:
      start: "2017-01-02 00:00:00"
      end: "2018-12-30 23:00:00"
    val:
      start: "2019-01-07 00:00:00"
      end: "2019-07-07 23:00:00"
    test:
      start: "2019-07-15 00:00:00"
      end: "2019-12-29 23:00:00"

